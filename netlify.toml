# =============================================================
# netlify.toml — konfigurasi deploy Netlify
# Situs statis: build.js menghasilkan folder /public
# =============================================================

[build]
  command  = "node build.js"
  publish  = "public"

[build.environment]
  NODE_VERSION = "20"
  # SITE_URL diisi otomatis oleh Netlify (URL deploy),
  # dipakai build.js untuk canonical + sitemap.

# Redirect diatur di public/_redirects (satu sumber, ikut ter-generate build.js):
#   /admin -> /admin/index.html (200)
#   /*     -> /404.html         (404)

# ------------------------------- HEADERS -------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options  = "nosniff"
    X-Frame-Options         = "SAMEORIGIN"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type          = "text/javascript; charset=utf-8"
    Cache-Control         = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
